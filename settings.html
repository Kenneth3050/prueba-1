<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cubo</title>
<link rel="stylesheet" href="shared.css">
<style>
:root{color-scheme:dark;--bg:#0e1022;--panel:#171a35;--card:#1c2042;--line:#ffffff1a;--text:#eef0ff;--muted:#a3a8d6;--acc:#7c8cff;--acc2:#ff7ad9}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:radial-gradient(800px 500px at 85% -10%,#3a2f7a66,transparent 70%),radial-gradient(600px 400px at -5% 110%,#7c3a8f44,transparent 70%),var(--bg);color:var(--text);font:14px "Segoe UI",system-ui,sans-serif}
#app{display:flex;height:100%}
aside{width:210px;flex:none;overflow-y:auto;padding:18px 12px;background:#0b0d1e99;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;-webkit-app-region:drag}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;padding:4px 10px 16px;letter-spacing:-.3px}
.logo{width:30px;height:30px;border-radius:9px}
.brand span{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;color:transparent}
.nav{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;cursor:pointer;color:var(--muted);font-weight:600;-webkit-app-region:no-drag}
.nav:hover{background:#ffffff0d;color:var(--text)}
.nav.on{background:linear-gradient(90deg,#7c8cff33,#ff7ad922);color:var(--text);box-shadow:inset 0 0 0 1px #7c8cff55}
.nav i{font-style:normal;width:22px;text-align:center}
.foot{margin-top:auto;font-size:11.5px;color:var(--muted);padding:10px;line-height:1.5}
main{flex:1;min-width:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 22px 6px;-webkit-app-region:drag}
header h1{margin:0;font-size:20px;letter-spacing:-.3px}
.wb{display:flex;gap:6px;-webkit-app-region:no-drag}
.wb button{all:unset;cursor:pointer;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.wb button:hover{background:#ffffff14;color:var(--text)}
.wb .cl:hover{background:#ff453a;color:#fff}
#pvc{margin:6px 22px 0;padding:14px 16px 18px;border-radius:18px;background:repeating-linear-gradient(45deg,#ffffff06 0 10px,transparent 10px 20px),#10132b;border:1px solid var(--line)}
#pvc small{display:block;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
#pv{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;min-height:56px;font-family:"Segoe UI",system-ui,sans-serif}
.mk{position:relative;display:inline-flex;align-items:center;gap:10px;padding:0 14px;height:38px;background-color:var(--isl);color:var(--fg);overflow:hidden;white-space:nowrap;font-size:14px}
.mk .z{position:relative;z-index:1;display:flex;align-items:center;gap:10px}
.mk b{font-variant-numeric:tabular-nums}
.mk .t2{font-size:12px;opacity:.7}
.mk .cv2{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,#38bdf8,#6366f1)}
.mk .bars{display:flex;gap:2px;align-items:center;height:14px}
.mk .bars i{width:3px;background:var(--acc2x,var(--acc));border-radius:2px;height:4px;animation:b .8s ease-in-out infinite alternate}
.mk .bars i:nth-child(2){animation-delay:.2s}.mk .bars i:nth-child(3){animation-delay:.4s}.mk .bars i:nth-child(4){animation-delay:.1s}
@keyframes b{to{height:14px}}
.mk .bar{width:90px;height:4px;border-radius:2px;background:#ffffff30;overflow:hidden}
.mk .bar i{display:block;height:100%;width:60%;background:var(--acc)}
#pane{flex:1;overflow-y:auto;padding:14px 22px 26px}
#pane::-webkit-scrollbar{width:10px}#pane::-webkit-scrollbar-thumb{background:#ffffff22;border-radius:6px}
.sec{display:none;grid-template-columns:1fr 1fr;gap:10px}
.sec.on{display:grid}
@media (max-width:1000px){.sec{grid-template-columns:1fr}}
.r{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;min-height:56px}
.r.full{grid-column:1/-1}
.lb b{display:block;font-weight:600}
.lb small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px;line-height:1.35}
.rg{display:flex;align-items:center;gap:10px}
.rg .val{width:46px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px}
input[type=range]{width:140px;accent-color:var(--acc)}
input[type=color]{width:46px;height:28px;border:1px solid var(--line);border-radius:8px;background:none;padding:0;cursor:pointer}
input[type=text],input[type=number],input[type=date],select{background:#0e1022;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font:inherit;max-width:180px}
input[type=number]{width:80px}
textarea{background:#0e1022;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;width:300px;max-width:100%;resize:vertical}
input.wide{max-width:260px;width:260px}
.sw{position:relative;width:44px;height:24px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:99px;background:#ffffff22;transition:.2s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:linear-gradient(90deg,var(--acc),var(--acc2))}
.sw input:checked+i::after{transform:translateX(20px)}
button.b{font:inherit;font-weight:600;color:var(--text);background:#ffffff12;border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
button.b:hover{border-color:var(--acc);background:#7c8cff22}
.themes{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-weight:600;color:#fff;border:1px solid #ffffff33;border-radius:99px;padding:7px 14px;cursor:pointer;text-shadow:0 1px 3px #000a}
.chip:hover{transform:translateY(-1px);border-color:#fff}
.note{grid-column:1/-1;color:var(--muted);font-size:12.5px;line-height:1.7;padding:4px 4px}
.note kbd{background:#ffffff14;border:1px solid var(--line);border-radius:6px;padding:1px 6px;font:inherit;font-size:11.5px;color:var(--text)}
</style>
</head>
<body>
<div id="app">
  <aside id="side"></aside>
  <main>
    <header><h1 id="ttl"></h1><div class="wb"><button id="bmin" aria-label="min">—</button><button id="bcl" class="cl" aria-label="close">✕</button></div></header>
    <div id="pvc"><small id="pvl"></small><div id="pv"></div></div>
    <div id="pane"></div>
  </main>
</div>
<script src="shared.js"></script>

  {k:'font',t:'select',l:['Tipo de letra','Font']},

  {k:'cdDate',t:'date',l:['Cuenta regresiva: fecha','Countdown: date']},
  {t:'btn',a:'test',b:['Probar aviso','Test alert']}
 ]},


 {id:'tools',ic:'🧰',n:['Herramientas','Tools'],items:[
  {k:'pomoWork',t:'number',min:1,max:120,l:['Pomodoro: minutos de enfoque','Pomodoro: focus minutes']},
  {k:'pomoBreak',t:'number',min:1,max:60,l:['Pomodoro: minutos de descanso','Pomodoro: break minutes']},
  {k:'clipHistory',t:'toggle',l:['Historial del portapapeles','Clipboard history'],d:['Guarda solo en memoria los últimos textos copiados. No copies contraseñas con esto activo.','Keeps the last copied texts in memory only. Do not copy passwords while on.']},
  {k:'zones',t:'text',w:1,ph:['Madrid=Europe/Madrid, Tokio=Asia/Tokyo','Madrid=Europe/Madrid, Tokyo=Asia/Tokyo'],l:['Relojes del mundo','World clocks'],d:['Hasta 3, separados por coma. Aparecen al expandir la hora','Up to 3, comma-separated. Shown when the clock is expanded']},
  {k:'launchers',t:'area',l:['Accesos rápidos','Quick launchers'],d:['Una línea por acceso: Nombre | programa, carpeta o enlace. Máximo 8','One line per launcher: Name | program, folder or link. Up to 8']},
  {t:'note',x:['Atajos: <kbd>Ctrl</kbd>+<kbd>Alt</kbd>+ <kbd>4</kbd> cronómetro · <kbd>5</kbd> pomodoro · <kbd>6</kbd> rendimiento · <kbd>7</kbd> portapapeles · <kbd>8</kbd> accesos · <kbd>K</kbd> silenciar micrófono. También con los botones al expandir la hora.','Shortcuts: <kbd>Ctrl</kbd>+<kbd>Alt</kbd>+ <kbd>4</kbd> stopwatch · <kbd>5</kbd> pomodoro · <kbd>6</kbd> performance · <kbd>7</kbd> clipboard · <kbd>8</kbd> launchers · <kbd>K</kbd> mute microphone. Also with the buttons when the clock is expanded.']}

function optsFor(it){
  if(it.k==='voiceName'){let v=[];try{v=speechSynthesis.getVoices()}catch(e){}return [['',L(['Automática','Automatic'])]].concat(v.map(x=>[x.name,x.name+' ('+x.lang+')']))}
  if(it.k==='monitor')return (DISP.length?DISP:[{i:0,primary:true,w:0,h:0}]).map((d,i)=>[String(i),'Monitor '+(i+1)+(d.primary?' ★':'')+(d.w?' ('+d.w+'×'+d.h+')':'')]);
  return OPT[it.k]||[];
}
function mk(it){
  const el=document.createElement('div');
  if(it.t==='note'){el.className='note';el.innerHTML=L(it.x);return el}
  if(it.t==='themes'){
    el.className='r full';
    el.innerHTML=`<div class="lb"><b>${L(['Temas listos','Ready themes'])}</b><small>${L(['Un clic cambia fondo, acento y texto','One click sets background, accent and text'])}</small></div><div class="themes">${THEMES.map((t,i)=>`<button class="chip" data-th="${i}" style="background:linear-gradient(135deg,${t[1].bg} 40%,${t[1].accent})">${L(t[0])}</button>`).join('')}</div>`;
    return el;
  }
  el.className='r';
  const lab=it.l?`<div class="lb"><b>${L(it.l)}</b>${it.d?`<small>${L(it.d)}</small>`:''}</div>`:'<div></div>';
  let ctl='';
  if(it.t==='range')ctl=`<div class="rg"><input type="range" data-k="${it.k}" min="${it.min}" max="${it.max}" step="${it.step}"><span class="val" data-v="${it.k}"></span></div>`;
  else if(it.t==='color')ctl=`<input type="color" data-k="${it.k}">`;
  else if(it.t==='toggle')ctl=`<label class="sw"><input type="checkbox" data-k="${it.k}"><i></i></label>`;
  else if(it.t==='select')ctl=`<select data-k="${it.k}"${it.num?' data-num="1"':''}>${optsFor(it).map(o=>`<option value="${o[0]}">${typeof o[1]==='string'?o[1]:L(o[1])}</option>`).join('')}</select>`;
  else if(it.t==='text')ctl=`<input type="text"${it.w?' class="wide"':''} data-k="${it.k}" placeholder="${it.ph?L(it.ph):''}">`;
  else if(it.t==='area')ctl=`<textarea data-k="${it.k}" rows="5" spellcheck="false"></textarea>`;
  else if(it.t==='number')ctl=`<input type="number" data-k="${it.k}" min="${it.min}" max="${it.max}">`;
  else if(it.t==='date')ctl=`<input type="date" data-k="${it.k}">`;
  else if(it.t==='btn'){el.className='r full';el.innerHTML=`<button class="b" data-act="${it.a}">${L(it.b)}</button>`;return el}
  el.innerHTML=lab+ctl;
  return el;
}
function build(){
  $('#ttl').textContent=L(['Configuración','Settings']);
  $('#pvl').textContent=L(['Vista previa en vivo','Live preview']);
  document.title='Cubo — '+L(['Configuración','Settings']);
  document.documentElement.lang=LANG;
  $('#side').innerHTML=`<div class="brand"><img class="logo" src="assets/logo.png" alt=""><span>Cubo</span></div>`+SECT.map(s=>`<button class="nav${s.id===active?' on':''}" data-nav="${s.id}"><i>${s.ic}</i>${L(s.n)}</button>`).join('')+`<div class="foot">${L(['Los cambios se aplican al instante y se guardan solos.','Changes apply instantly and save automatically.'])}</div>`;
  const pane=$('#pane');pane.innerHTML='';
  SECT.forEach(s=>{
    const d=document.createElement('div');d.className='sec'+(s.id===active?' on':'');d.id='sec-'+s.id;
    s.items.forEach(it=>d.appendChild(mk(it)));
    pane.appendChild(d);
  });
  wire();
}
function valOf(el){
  if(el.type==='checkbox')return el.checked;
  if(el.type==='range'||el.type==='number')return Number(el.value);
  if(el.dataset.num)return Number(el.value);
  return el.value;
}
function setVal(k,v){
  cfg[k]=v;
  api.setSettings({[k]:v});
  preview();
}
function wire(){
  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{
    active=b.dataset.nav;
    document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n===b));
    document.querySelectorAll('.sec').forEach(s=>s.classList.toggle('on',s.id==='sec-'+active));
    $('#pane').scrollTop=0;
  });
  document.querySelectorAll('[data-k]').forEach(el=>{
    const ev=(el.type==='range'||el.type==='color')?'input':'change';
    el.addEventListener(ev,()=>{
      const v=valOf(el);
      if(el.type==='range')showVal(el.dataset.k,v);
      setVal(el.dataset.k,v);
    });
  });
  document.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{
    const t=THEMES[b.dataset.th][1];
    Object.assign(cfg,t,{borderColor:t.accent});
    api.setSettings({...t,borderColor:t.accent});
    fill(cfg);
  });
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.act;
    if(a==='rpos')api.resetPos();
    if(a==='rall')api.resetAll();
    if(a==='test')api.testNotify();
    if(a==='voice')api.voiceTest();
    if(a==='speak')api.speakTest();
    if(a==='notes')api.openNotes();
  });
}
function itemOf(k){for(const s of SECT)for(const it of s.items)if(it.k===k)return it}
function showVal(k,v){
  const it=itemOf(k),el=document.querySelector(`[data-v="${k}"]`);
  if(it&&el)el.textContent=Math.round(v*it.m*10)/10+(it.u||'');
}
function fill(c){
  cfg=c;
  if(c.lang!==LANG){LANG=c.lang;build()}
  document.querySelectorAll('[data-k]').forEach(el=>{
    const k=el.dataset.k;if(!(k in c)||document.activeElement===el)return;
    if(el.type==='checkbox')el.checked=!!c[k];else el.value=c[k]==null?'':c[k];
    if(el.type==='range')showVal(k,c[k]);
  });
  preview();
}

/* vista previa */
const rgba=(h,a)=>{const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`};
function preview(){
  const c=cfg;if(!c)return;
  const pv=$('#pv');
  pv.style.setProperty('--isl',rgba(c.bg,c.opacity));
  pv.style.setProperty('--acc',c.accent);pv.style.setProperty('--fg',c.fg);
  pv.style.setProperty('--wv1','#2f8fd8');pv.style.setProperty('--wv2','#1d5a8c');
  pv.style.fontFamily=`"${c.font}","Segoe UI Emoji",system-ui,sans-serif`;
  const rad=r=>c.shape==='square'?Math.min(r,8):c.shape==='soft'?Math.min(r,16):r;
  const ring=c.borderW>0?`0 0 0 ${c.borderW}px ${c.borderColor}`:'0 0 0 1px #ffffff22';
  const sty=(r,extra='')=>`style="border-radius:${rad(r)}px;box-shadow:${c.shadow?'0 6px 16px #0006,':''}${ring};zoom:${c.scale};${extra}"`;
  const mas=(sz,cls)=>c.mascot?`<svg class="mas ${cls}" style="width:${Math.round(sz*c.mascotSize)}px;height:${Math.round(sz*c.mascotSize)}px" viewBox="0 0 32 32">${MASCOTS[c.mascotType]||MASCOTS.penguin}</svg>`:'';
  const music=c.coverMode==='bg';
  pv.innerHTML=
   `<div class="mk" ${sty(18)}><div class="z"><b>20:22</b><span class="t2">⛅ 23°</span><span class="t2">mié 28</span>${mas(28,'')}</div></div>`+
   `<div class="mk ${music?'wv':''} play" ${sty(20)}><div class="wvbox">${WAVES}</div><div class="z"><div class="cv2"></div><b style="font-size:13px">Canción</b><div class="bars"><i></i><i></i><i></i><i></i></div>${mas(28,(c.headphones?'on ':'')+'dance')}</div></div>`+
   `<div class="mk" ${sty(19)}><div class="z"><span>🔊</span><div class="bar"><i></i></div><b style="font-size:13px">60%</b></div></div>`;
}

try{speechSynthesis.onvoiceschanged=()=>{if(cfg){build();fill(cfg)}}}catch(e){}
$('#bcl').onclick=()=>api.closeSettings();
$('#bmin').onclick=()=>api.minSettings();
api.on('settings',fill);
Promise.all([api.getDisplays().catch(()=>[]),api.getSettings()]).then(([d,c])=>{DISP=d||[];LANG=c.lang;cfg=c;build();fill(c)});
</script>
</body>
