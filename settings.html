<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cubo</title>
<link rel="stylesheet" href="shared.css">
<style>
:root{color-scheme:dark;--bg:#000;--line:#ffffff1f;--text:#f3f6ff;--muted:#98a2c8;--c1:#22d3ee;--c2:#e879f9;--c3:#fb923c;--acc:#22d3ee;--grad:linear-gradient(90deg,#22d3ee,#e879f9,#fb923c)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:#000;color:var(--text);font:14px "Segoe UI",system-ui,sans-serif}
#bg{position:fixed;inset:0;overflow:hidden;z-index:0}
#bg i{position:absolute;width:560px;height:560px;border-radius:50%;filter:blur(100px);opacity:.3;animation:drift 20s ease-in-out infinite alternate}
#bg .o1{background:var(--c1);left:-160px;top:-180px}
#bg .o2{background:var(--c2);right:-200px;top:18%;animation-delay:-7s}
#bg .o3{background:var(--c3);left:34%;bottom:-300px;animation-delay:-13s}
@keyframes drift{to{transform:translate(90px,70px) scale(1.18)}}
#grid{position:fixed;inset:0;z-index:0;background-image:linear-gradient(#ffffff09 1px,transparent 1px),linear-gradient(90deg,#ffffff09 1px,transparent 1px);background-size:38px 38px;-webkit-mask-image:radial-gradient(ellipse at 62% 38%,#000 15%,transparent 72%);mask-image:radial-gradient(ellipse at 62% 38%,#000 15%,transparent 72%)}
#app{position:relative;z-index:1;display:flex;height:100%}
aside{width:236px;flex:none;overflow-y:auto;padding:16px 12px;background:#00000099;backdrop-filter:blur(14px);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;-webkit-app-region:drag}
aside::-webkit-scrollbar{width:0}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 16px;-webkit-app-region:drag}
.logo{width:40px;height:40px;border-radius:12px;filter:drop-shadow(0 0 14px #22d3ee88);animation:spin3d 9s linear infinite}
@keyframes spin3d{0%{transform:perspective(220px) rotateY(0)}100%{transform:perspective(220px) rotateY(360deg)}}
.brand b{display:block;font-size:22px;letter-spacing:.18em;font-weight:900;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;color:var(--muted);font-size:10.5px;letter-spacing:.06em;margin-top:1px}
.nav{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:11px;padding:7px 10px;border-radius:14px;cursor:pointer;color:var(--muted);font-weight:600;border:1px solid transparent;-webkit-app-region:no-drag}
.nav .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:#ffffff0d;border:1px solid #ffffff14;font-size:15px;flex:none;transition:.25s}
.nav:hover{background:#ffffff0a;color:var(--text)}
.nav.on{color:#fff;background:linear-gradient(#08080f,#08080f) padding-box,var(--grad) border-box;box-shadow:0 0 24px #22d3ee22,0 0 40px #e879f914}
.nav.on .ic{background:var(--grad);border-color:transparent;box-shadow:0 0 14px #e879f988}
.foot{margin-top:auto;font-size:11.5px;color:var(--muted);padding:10px;line-height:1.5}
main{flex:1;min-width:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:14px;padding:14px 22px 6px;-webkit-app-region:drag}
header h1{margin:0;font-size:20px;letter-spacing:-.2px;flex:none}
.srch{position:relative;flex:1;max-width:340px;-webkit-app-region:no-drag}
.srch input{width:100%;background:#ffffff0d;color:var(--text);border:1px solid var(--line);border-radius:99px;padding:8px 14px 8px 36px;font:inherit}
.srch input:focus{outline:none;border-color:#22d3ee;box-shadow:0 0 0 3px #22d3ee22}
.srch span{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.7;pointer-events:none}
.wb{display:flex;gap:6px;margin-left:auto;-webkit-app-region:no-drag}
.wb button{all:unset;cursor:pointer;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.wb button:hover{background:#ffffff14;color:var(--text)}
.wb .cl:hover{background:#ff453a;color:#fff}
#pvc{margin:6px 22px 0;padding:12px 16px 14px;border-radius:18px;background:linear-gradient(#000,#000) padding-box,linear-gradient(120deg,#22d3ee66,#e879f966,#fb923c66) border-box;border:1px solid transparent}
#pvc small{display:block;color:var(--muted);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
#pv{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;min-height:50px}
.mk{position:relative;display:inline-flex;align-items:center;gap:10px;padding:0 14px;height:38px;background-color:var(--isl);color:var(--fg);overflow:hidden;white-space:nowrap;font-size:14px}
.mk .z{position:relative;z-index:1;display:flex;align-items:center;gap:10px}
.mk b{font-variant-numeric:tabular-nums}
.mk .t2{font-size:12px;opacity:.7}
.mk .cv2{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,#38bdf8,#6366f1)}
.mk .bars{display:flex;gap:2px;align-items:center;height:14px}
.mk .bars i{width:3px;background:var(--acc);border-radius:2px;height:4px;animation:b .8s ease-in-out infinite alternate}
.mk .bars i:nth-child(2){animation-delay:.2s}.mk .bars i:nth-child(3){animation-delay:.4s}.mk .bars i:nth-child(4){animation-delay:.1s}
@keyframes b{to{height:14px}}
.mk .bar{width:90px;height:4px;border-radius:2px;background:#ffffff30;overflow:hidden}
.mk .bar i{display:block;height:100%;width:60%;background:var(--acc)}
#pane{flex:1;overflow-y:auto;padding:12px 22px 26px}
#pane::-webkit-scrollbar{width:10px}#pane::-webkit-scrollbar-thumb{background:#ffffff26;border-radius:6px}
.sec{display:none;grid-template-columns:1fr 1fr;gap:10px;align-content:start}
.sec.on{display:grid}
body.searching .sec{display:grid}
.sec.empty-s{display:none!important}
.r.hide{display:none}
body.searching .hero,body.searching .note{display:none}
@media (max-width:1000px){.sec{grid-template-columns:1fr}}
.hero{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:6px 4px 10px}
.hero .hic{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;font-size:26px;background:#ffffff0d;border:1px solid #ffffff22;box-shadow:0 0 30px #22d3ee33,inset 0 0 20px #e879f922;flex:none}
.hero h2{margin:0;font-size:24px;font-weight:900;letter-spacing:-.3px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:4px 0 0;color:var(--muted);line-height:1.5;max-width:560px}
.r{position:relative;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 15px;background:linear-gradient(180deg,#ffffff0c,#ffffff04);border:1px solid var(--line);border-radius:16px;min-height:62px;transition:.2s}
.r:hover{border-color:#22d3ee66;box-shadow:0 0 28px #22d3ee14}
.r.full{grid-column:1/-1}
.lb{min-width:0}
.lb b{display:block;font-weight:700}
.lb small{display:block;color:var(--muted);font-size:12px;margin-top:3px;line-height:1.4}
.rg{display:flex;align-items:center;gap:10px;flex:none}
.rg .val{width:50px;text-align:right;color:#bff4ff;font-variant-numeric:tabular-nums;font-size:12.5px}
input[type=range]{width:140px;accent-color:#e879f9}
input[type=color]{width:46px;height:28px;border:1px solid var(--line);border-radius:8px;background:none;padding:0;cursor:pointer;flex:none}
input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{background:#000;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font:inherit;max-width:190px}
input:focus,select:focus,textarea:focus{outline:none;border-color:#22d3ee;box-shadow:0 0 0 3px #22d3ee22}
input[type=number]{width:80px}
textarea{width:300px;max-width:100%;resize:vertical}
input.wide{max-width:260px;width:260px}
.sk{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.stt{font-size:11.5px;color:var(--muted)}.stt.ok{color:#4ade80}
.sw{position:relative;width:46px;height:25px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:99px;background:#ffffff1f;transition:.2s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--grad);box-shadow:0 0 16px #e879f966}
.sw input:checked+i::after{transform:translateX(21px)}
button.b{font:inherit;font-weight:700;color:#fff;background:linear-gradient(#0b0b14,#0b0b14) padding-box,var(--grad) border-box;border:1px solid transparent;border-radius:12px;padding:9px 16px;cursor:pointer;transition:.2s}
button.b:hover{box-shadow:0 0 22px #e879f955;transform:translateY(-1px)}
.themes{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-weight:700;color:#fff;border:1px solid #ffffff33;border-radius:99px;padding:7px 14px;cursor:pointer;text-shadow:0 1px 3px #000a}
.chip:hover{transform:translateY(-1px);border-color:#fff;box-shadow:0 0 18px #ffffff33}
.note{grid-column:1/-1;color:var(--muted);font-size:12.5px;line-height:1.7;padding:4px 6px}
.note kbd{background:#ffffff14;border:1px solid var(--line);border-radius:6px;padding:1px 6px;font:inherit;font-size:11.5px;color:var(--text)}
@media (prefers-reduced-motion:reduce){#bg i,.logo,.mk .bars i{animation:none}}
</style>
</head>
<body>
<div id="bg"><i class="o1"></i><i class="o2"></i><i class="o3"></i></div><div id="grid"></div>
<div id="app">
  <aside id="side"></aside>
  <main>
    <header><h1 id="ttl"></h1><div class="srch"><span>🔍</span><input id="q" type="search" autocomplete="off"></div><div class="wb"><button id="bmin" aria-label="min">—</button><button id="bcl" class="cl" aria-label="close">✕</button></div></header>
    <div id="pvc"><small id="pvl"></small><div id="pv"></div></div>
    <div id="pane"></div>
  </main>
</div>
<script src="shared.js"></script>

 ]},

function optsFor(it){
  if(it.k==='voiceName'){let v=[];try{v=speechSynthesis.getVoices()}catch(e){}return [['',L(['Automática','Automatic'])]].concat(v.map(x=>[x.name,x.name+' ('+x.lang+')']))}
  if(it.k==='monitor')return (DISP.length?DISP:[{i:0,primary:true,w:0,h:0}]).map((d,i)=>[String(i),'Monitor '+(i+1)+(d.primary?' ★':'')+(d.w?' ('+d.w+'×'+d.h+')':'')]);
  return OPT[it.k]||[];
}
function mk(it){
  const el=document.createElement('div');
  if(it.t==='note'){el.className='note';el.innerHTML=L(it.x);return el}
  if(it.t==='themes'){
    el.className='r full';
    el.innerHTML=`<div class="lb"><b>${L(['Temas listos','Ready themes'])}</b><small>${L(['Un clic cambia fondo, acento y texto.','One click sets background, accent and text.'])}</small></div><div class="themes">${THEMES.map((t,i)=>`<button class="chip" data-th="${i}" style="background:linear-gradient(135deg,${t[1].bg} 40%,${t[1].accent})">${L(t[0])}</button>`).join('')}</div>`;
    return el;
  }
  el.className='r';
  const lab=it.l?`<div class="lb"><b>${L(it.l)}</b>${it.d?`<small>${L(it.d)}</small>`:''}</div>`:'<div></div>';
  let ctl='';
  if(it.t==='range')ctl=`<div class="rg"><input type="range" data-k="${it.k}" min="${it.min}" max="${it.max}" step="${it.step}"><span class="val" data-v="${it.k}"></span></div>`;
  else if(it.t==='color')ctl=`<input type="color" data-k="${it.k}">`;
  else if(it.t==='toggle')ctl=`<label class="sw"><input type="checkbox" data-k="${it.k}"><i></i></label>`;
  else if(it.t==='select')ctl=`<select data-k="${it.k}"${it.num?' data-num="1"':''}>${optsFor(it).map(o=>`<option value="${o[0]}">${typeof o[1]==='string'?o[1]:L(o[1])}</option>`).join('')}</select>`;
  else if(it.t==='text')ctl=`<input type="text"${it.w?' class="wide"':''} data-k="${it.k}" placeholder="${it.ph?L(it.ph):''}">`;
  else if(it.t==='area')ctl=`<textarea data-k="${it.k}" rows="5" spellcheck="false"></textarea>`;
  else if(it.t==='number')ctl=`<input type="number" data-k="${it.k}" min="${it.min}" max="${it.max}">`;
  else if(it.t==='date')ctl=`<input type="date" data-k="${it.k}">`;
  else if(it.t==='secret')ctl=`<div class="sk"><input type="password" data-sec="${it.p}" placeholder="${L(['Pega tu clave aquí','Paste your key here'])}" autocomplete="off"><span class="stt" data-st="${it.p}"></span></div>`;
  else if(it.t==='btn'){el.className='r full';el.innerHTML=`<button class="b" data-act="${it.a}">${L(it.b)}</button>`;return el}
  el.innerHTML=lab+ctl;
  return el;
}
function build(){
  $('#ttl').textContent=L(['Configuración','Settings']);
  $('#pvl').textContent=L(['Vista previa en vivo','Live preview']);
  $('#q').placeholder=L(['Buscar una opción…','Search an option…']);
  document.title='Cubo — '+L(['Configuración','Settings']);
  document.documentElement.lang=LANG;
  $('#side').innerHTML=`<div class="brand"><img class="logo" src="assets/logo.png" alt=""><div><b>CUBO</b><small>${L(['ISLA DINÁMICA','DYNAMIC ISLAND'])}</small></div></div>`+SECT.map(s=>`<button class="nav${s.id===active?' on':''}" data-nav="${s.id}"><span class="ic">${s.ic}</span>${L(s.n)}</button>`).join('')+`<div class="foot">${L(['Los cambios se aplican al instante y se guardan solos.','Changes apply instantly and save automatically.'])}</div>`;
  const pane=$('#pane');pane.innerHTML='';
  SECT.forEach(s=>{
    const d=document.createElement('div');d.className='sec'+(s.id===active?' on':'');d.id='sec-'+s.id;
    const hero=document.createElement('div');hero.className='hero';
    hero.innerHTML=`<div class="hic">${s.ic}</div><div><h2>${L(s.n)}</h2><p>${L(s.i)}</p></div>`;
    d.appendChild(hero);
    s.items.forEach(it=>d.appendChild(mk(it)));
    pane.appendChild(d);
  });
  wire();
}
function valOf(el){
  if(el.type==='checkbox')return el.checked;
  if(el.type==='range'||el.type==='number')return Number(el.value);
  if(el.dataset.num)return Number(el.value);
  return el.value;
}
function setVal(k,v){cfg[k]=v;api.setSettings({[k]:v});preview()}
function applySearch(){
  const q=$('#q').value.trim().toLowerCase();
  document.body.classList.toggle('searching',!!q);
  document.querySelectorAll('.sec').forEach(sec=>{
    let any=false;
    sec.querySelectorAll('.r').forEach(r=>{const hit=!q||r.textContent.toLowerCase().includes(q);r.classList.toggle('hide',!hit);if(hit)any=true});
    sec.classList.toggle('empty-s',!!q&&!any);
  });
}
function wire(){
  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{
    active=b.dataset.nav;$('#q').value='';applySearch();
    document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n===b));
    document.querySelectorAll('.sec').forEach(s=>s.classList.toggle('on',s.id==='sec-'+active));
    $('#pane').scrollTop=0;
  });
  document.querySelectorAll('[data-k]').forEach(el=>{
    const ev=(el.type==='range'||el.type==='color')?'input':'change';
    el.addEventListener(ev,()=>{
      const v=valOf(el);
      if(el.type==='range')showVal(el.dataset.k,v);
      setVal(el.dataset.k,v);
    });
  });
  document.querySelectorAll('[data-sec]').forEach(el=>el.addEventListener('change',()=>{
    api.aiSetKey(el.dataset.sec,el.value.trim());el.value='';
  }));
  document.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{
    const t=THEMES[b.dataset.th][1];
    Object.assign(cfg,t,{borderColor:t.accent});
    api.setSettings({...t,borderColor:t.accent});
    fill(cfg);
  });
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.act;
    if(a==='rpos')api.resetPos();
    if(a==='rall')api.resetAll();
    if(a==='test')api.testNotify();
    if(a==='voice')api.voiceTest();
    if(a==='speak')api.speakTest();
    if(a==='notes')api.openNotes();
  });
}
function itemOf(k){for(const s of SECT)for(const it of s.items)if(it.k===k)return it}
function showVal(k,v){
  const it=itemOf(k),el=document.querySelector(`[data-v="${k}"]`);
  if(it&&el)el.textContent=Math.round(v*it.m*10)/10+(it.u||'');
}
function fill(c){
  cfg=c;
  if(c.lang!==LANG){LANG=c.lang;build()}
  document.querySelectorAll('[data-k]').forEach(el=>{
    const k=el.dataset.k;if(!(k in c)||document.activeElement===el)return;
    if(el.type==='checkbox')el.checked=!!c[k];else el.value=c[k]==null?'':c[k];
    if(el.type==='range')showVal(k,c[k]);
  });
  document.querySelectorAll('[data-st]').forEach(s=>{
    const ok=!!(c.aiKeys&&c.aiKeys[s.dataset.st]);
    s.textContent=ok?L(['✓ Guardada','✓ Saved']):L(['Sin clave','No key']);
    s.className='stt'+(ok?' ok':'');
  });
  preview();
}

/* vista previa */
const rgba=(h,a)=>{const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`};
function preview(){
  const c=cfg;if(!c)return;
  const pv=$('#pv');
  pv.style.setProperty('--isl',rgba(c.bg,c.opacity));
  pv.style.setProperty('--acc',c.accent);pv.style.setProperty('--fg',c.fg);
  pv.style.setProperty('--wv1','#2f8fd8');pv.style.setProperty('--wv2','#1d5a8c');
  pv.style.fontFamily=`"${c.font}","Segoe UI Emoji",system-ui,sans-serif`;
  const rad=r=>c.shape==='square'?Math.min(r,8):c.shape==='soft'?Math.min(r,16):r;
  const ring=c.borderW>0?`0 0 0 ${c.borderW}px ${c.borderColor}`:'0 0 0 1px #ffffff22';
  const sty=(r,extra='')=>`style="border-radius:${rad(r)}px;box-shadow:${c.shadow?'0 6px 16px #0006,':''}${ring};zoom:${c.scale};${extra}"`;
  const mas=(sz,cls)=>c.mascot?`<svg class="mas ${cls}" style="width:${Math.round(sz*c.mascotSize)}px;height:${Math.round(sz*c.mascotSize)}px" viewBox="0 0 32 32">${MASCOTS[c.mascotType]||MASCOTS.penguin}</svg>`:'';
  const music=c.coverMode==='bg';
  pv.innerHTML=
   `<div class="mk" ${sty(18)}><div class="z"><b>20:22</b><span class="t2">⛅ 23°</span><span class="t2">mié 28</span>${mas(28,'')}</div></div>`+
   `<div class="mk ${music?'wv':''} play" ${sty(20)}><div class="wvbox">${WAVES}</div><div class="z"><div class="cv2"></div><b style="font-size:13px">Canción</b><div class="bars"><i></i><i></i><i></i><i></i></div>${mas(28,(c.headphones?'on ':'')+'dance')}</div></div>`+
   `<div class="mk" ${sty(19)}><div class="z"><span>🔊</span><div class="bar"><i></i></div><b style="font-size:13px">60%</b></div></div>`;
}

try{speechSynthesis.onvoiceschanged=()=>{if(cfg){build();fill(cfg)}}}catch(e){}
$('#q').addEventListener('input',applySearch);
$('#bcl').onclick=()=>api.closeSettings();
$('#bmin').onclick=()=>api.minSettings();
api.on('settings',fill);
Promise.all([api.getDisplays().catch(()=>[]),api.getSettings()]).then(([d,c])=>{DISP=d||[];LANG=c.lang;cfg=c;build();fill(c)});
</script>
