<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Isla dinámica</title>
<link rel="stylesheet" href="shared.css">
<style>
:root{--isl:rgba(0,0,0,1);--acc:#32d74b;--fg:#ffffff;--sc:1;--tw:.55s;--green:#32d74b;--amber:#ffb340}
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
body{font-family:"Segoe UI","Segoe UI Emoji",system-ui,sans-serif;color:var(--fg);display:flex;justify-content:center;user-select:none}
#isl{position:relative;margin-top:8px;background-color:var(--isl);color:var(--fg);border-radius:22px;overflow:hidden;cursor:pointer;width:130px;height:36px;flex:none;transform:scale(var(--sc));transform-origin:50% 0;
transition:width var(--tw) cubic-bezier(.34,1.35,.5,1),height var(--tw) cubic-bezier(.34,1.35,.5,1),border-radius var(--tw) cubic-bezier(.34,1.35,.5,1),opacity .3s,transform .25s,background-color .6s}
#isl.ghost{opacity:0}#isl.ghost:hover{opacity:.55}
#c{position:absolute;inset:0;z-index:1;padding:0 14px;display:flex;align-items:center;gap:10px;transition:opacity .16s,filter .16s,transform .16s;white-space:nowrap}
#c.out{opacity:0;filter:blur(6px);transform:scale(.96)}
#c.col{flex-direction:column;align-items:stretch;justify-content:center;gap:8px;padding:14px 18px!important}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.sp{flex:1}
.num{font-variant-numeric:tabular-nums;font-weight:600}
.cov{width:30px;height:30px;border-radius:8px;flex:none;background-size:cover}
.cov.l{width:62px;height:62px;border-radius:14px}
.t1{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t2{font-size:12px;opacity:.65;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.big{font-size:38px;font-weight:800;letter-spacing:-1px}
.bars{display:flex;gap:2px;align-items:center;height:16px;flex:none}
.bars i{width:3px;background:var(--acc);border-radius:2px;height:4px;transition:background .6s}
.bars.on i{animation:b .8s ease-in-out infinite alternate}
.bars i:nth-child(2){animation-delay:.2s}.bars i:nth-child(3){animation-delay:.4s}.bars i:nth-child(4){animation-delay:.1s}
@keyframes b{to{height:16px}}
.prog{height:4px;border-radius:2px;background:#ffffff30;overflow:hidden}
.prog b{display:block;height:100%;background:var(--acc);border-radius:2px;transition:width .9s linear,background .6s}
.ctl{display:flex;justify-content:center;gap:16px}
.ib{all:unset;cursor:pointer;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#ffffff1f}
.ib.sm{width:28px;height:28px}
.ib:hover{background:#ffffff38}
svg{width:16px;height:16px;fill:currentColor}
.mas{width:auto}
.vr{flex:1;min-width:0;height:16px;margin:0;cursor:pointer;accent-color:var(--acc)}
.ci{all:unset;cursor:pointer;display:block;box-sizing:border-box;width:100%;padding:7px 12px;border-radius:10px;background:#ffffff14;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.ci:hover{background:#ffffff2e}
.ap{width:92px;height:58px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green);animation:p 1.4s infinite;flex:none}
@keyframes p{50%{opacity:.35}}
.noanim,.noanim *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){#isl,#c{transition:none}.bars.on i,.dot,.mas .body,.mas .eyes,.mas .wl,.mas .wr,.wvbox svg{animation:none!important}}
</style>
</head>
<body>
<div id="isl"></div>
<script src="shared.js"></script>
<script>
const $=s=>document.querySelector(s),isl=$('#isl'),root=document.documentElement;
isl.innerHTML='<div class="wvbox">'+WAVES+'</div><div id="c"></div>';
const c=$('#c');
const esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const T={
es:{assistant:'Cubo',stopwatch:'Cronómetro',pomodoro:'Pomodoro',stats:'Rendimiento',clipboard:'Portapapeles',apps:'Accesos rápidos',shot:'Captura',lap:'Vuelta',mic:'Micrófono',clear:'Borrar',focus:'Enfoque',rest:'Descanso',longBreak:'Descanso largo',workTime:'¡A trabajar!',breakTime:'Hora de descansar',clipOff:'Activa el historial en Configuración > Herramientas',clipEmpty:'Aún no has copiado nada',noApps:'Agrega accesos en Configuración > Herramientas',micOn:'Micrófono activado',micOff:'Micrófono silenciado',listening:'Escuchando…',notHeard:'No te escuché. Inténtalo de nuevo.',noReco:'Falta el reconocimiento de voz en tu idioma. Actívalo en Windows: Hora e idioma > Voz.',voiceErr:'No pude usar el micrófono o el reconocimiento de voz.',notes:'Notas',settings:'Configuración',noMusic:'Sin música',noTitle:'Sin título',timer:'Temporizador',timerEnd:'Se acabó el tiempo',music:'Música',nothing:'No hay nada sonando en este momento',inCall:'En llamada',testT:'Aviso de prueba',testB:'Así se verá un aviso en tu isla',clear:'Despejado',partly:'Parcialmente nublado',cloudy:'Nublado',fog:'Niebla',drizzle:'Llovizna',rain:'Lluvia',snow:'Nieve',storm:'Tormenta',prev:'Anterior',pp:'Reproducir o pausar',next:'Siguiente',tp:'Pausar o reanudar',t1:'Sumar un minuto',tr:'Reiniciar',tx:'Cerrar',mute:'Silenciar',day:'día',days:'días',locale:'es'},
en:{assistant:'Cubo',stopwatch:'Stopwatch',pomodoro:'Pomodoro',stats:'Performance',clipboard:'Clipboard',apps:'Quick launchers',shot:'Screenshot',lap:'Lap',mic:'Microphone',clear:'Clear',focus:'Focus',rest:'Break',longBreak:'Long break',workTime:'Time to work!',breakTime:'Time for a break',clipOff:'Turn on history in Settings > Tools',clipEmpty:'You have not copied anything yet',noApps:'Add launchers in Settings > Tools',micOn:'Microphone on',micOff:'Microphone muted',listening:'Listening…',notHeard:'I did not hear you. Try again.',noReco:'Speech recognition is missing for your language. Enable it in Windows: Time & language > Speech.',voiceErr:'I could not use the microphone or speech recognition.',notes:'Notes',settings:'Settings',noMusic:'No music',noTitle:'Untitled',timer:'Timer',timerEnd:'Time is up',music:'Music',nothing:'Nothing is playing right now',inCall:'In a call',testT:'Test alert',testB:'This is how an alert looks on your island',clear:'Clear',partly:'Partly cloudy',cloudy:'Cloudy',fog:'Fog',drizzle:'Drizzle',rain:'Rain',snow:'Snow',storm:'Thunderstorm',prev:'Previous',pp:'Play or pause',next:'Next',tp:'Pause or resume',t1:'Add one minute',tr:'Reset',tx:'Close',mute:'Mute',day:'day',days:'days',locale:'en'}};
let C={scale:1,bg:'#000000',accent:'#32d74b',fg:'#ffffff',opacity:1,shape:'round',borderW:0,borderColor:'#7c8cff',shadow:true,animSpeed:'normal',font:'Segoe UI',align:'center',hideIdle:false,hoverExpand:false,lock:false,autoMusic:true,expandSecs:3.5,coverMode:'bg',showCover:true,showBars:true,showTimes:true,musicIgnore:'',calls:true,volOSD:true,wheelVol:true,volSlider:true,volStep:2,mascot:true,mascotType:'penguin',mascotSize:1,headphones:true,h24:true,seconds:false,weather:true,unit:'C',city:'',timerMin:5,msgSecs:4.2,sound:false,cdName:'',cdDate:'',voiceOn:true,voiceSpeak:true,voiceTimeout:7,voiceName:'',voiceRate:1,voicePitch:1,voiceVolume:100,notesOnIsland:true,pomoWork:25,pomoBreak:5,clipHistory:false,zones:'',launchers:'',lang:'es'};
const tt=k=>(T[C.lang]||T.es)[k]||k;
const I={play:'<svg viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z"/></svg>',pause:'<svg viewBox="0 0 16 16"><path d="M3 2h4v12H3zM9 2h4v12H9z"/></svg>',prev:'<svg viewBox="0 0 16 16"><path d="M3 2h2v12H3zM14 2v12L6 8z"/></svg>',next:'<svg viewBox="0 0 16 16"><path d="M11 2h2v12h-2zM2 2l8 6-8 6z"/></svg>',plus:'<svg viewBox="0 0 16 16"><path d="M7 2h2v5h5v2H9v5H7V9H2V7h5z"/></svg>',reset:'<svg viewBox="0 0 16 16"><path d="M8 2a6 6 0 105.700 4h-2.100A4 4 0 118 4V7l4-3.500L8 0z"/></svg>',x:'<svg viewBox="0 0 16 16"><path d="M3 1.500L8 6.500l5-5L14.500 3l-5 5 5 5L13 14.500l-5-5-5 5L1.500 13l5-5-5-5z"/></svg>',vol:'<svg viewBox="0 0 16 16"><path d="M2 6h3l4-3v10l-4-3H2z"/><path d="M11.200 5.200a4 4 0 010 5.600" fill="none" stroke="currentColor" stroke-width="1.400" stroke-linecap="round"/></svg>',mute:'<svg viewBox="0 0 16 16"><path d="M2 6h3l4-3v10l-4-3H2z"/><path d="M11 6l4 4M15 6l-4 4" fill="none" stroke="currentColor" stroke-width="1.400" stroke-linecap="round"/></svg>'};
const mm=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const tm=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const hue=s=>{let h=0;for(const ch of String(s))h=(h*31+ch.charCodeAt(0))%360;return h};
const cover=s=>`linear-gradient(135deg,hsl(${hue(s)} 80% 60%),hsl(${(hue(s)+60)%360} 80% 42%))`;
const bars=on=>`<div class="bars ${on?'on':''}"><i></i><i></i><i></i><i></i></div>`;
const S={cur:'idle',exp:false,manual:false,hov:false,prev:null,msg:{t:'',b:''},tLeft:300,tRun:false};
const VOL={vol:.5,mute:false,mic:false,known:false};
let M=null,W=null,lastKey='',curKey='',dismissKey='',pausedAt=0,autoT,msgT,callT,rt,hoverT,lastSet=0,lastSlider=0;
let coverImg='',hasCol=false,coverAcc='#e8e8f0',coverW1='#8a8a96',coverW2='#4a4a54';
let callApp=null,callStart=0,ac=null;
const TR=['msg','vol','listen'];
let NOTES=[],voiceBusy=false;
const SW={run:false,start:0,acc:0,laps:[]};
const PO={phase:'work',left:25*60,run:false,n:0};
let STATS={cpu:0,ram:0,used:0,total:0},CLIPS=[];
const swMs=()=>SW.acc+(SW.run?Date.now()-SW.start:0);
function swFmt(){const t=Math.floor(swMs()/100),d=t%10,s=Math.floor(t/10)%60,m=Math.floor(t/600);return m+':'+String(s).padStart(2,'0')+'.'+d}
const poLen=ph=>(ph==='work'?C.pomoWork:ph==='long'?C.pomoBreak*3:C.pomoBreak)*60;
const VIEWS=['sw','pomo','stats','clip','apps'];
function launchers(){
  return String(C.launchers||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{const i=l.indexOf('|');return i<0?{name:l,cmd:l}:{name:l.slice(0,i).trim(),cmd:l.slice(i+1).trim()}}).filter(a=>a.name&&a.cmd).slice(0,8);
}
function zonesLine(){
  if(!C.zones)return'';
  const out=[];
  for(const part of C.zones.split(',').map(s=>s.trim()).filter(Boolean).slice(0,3)){
    const [a,b]=part.includes('=')?part.split('=').map(s=>s.trim()):[null,part];
    try{const x=new Date().toLocaleTimeString(tt('locale'),{timeZone:b,hour:'2-digit',minute:'2-digit',hour12:!C.h24});out.push((a||b.split('/').pop().replace(/_/g,' '))+' '+x)}catch(e){}
  }
  return out.join(' · ');
}
const clock=()=>new Date().toLocaleTimeString(tt('locale'),{hour:'2-digit',minute:'2-digit',second:C.seconds?'2-digit':undefined,hour12:!C.h24});
const shortDate=()=>new Date().toLocaleDateString(tt('locale'),{weekday:'short',day:'numeric'}).replace('.','');
const dateStr=()=>new Date().toLocaleDateString(tt('locale'),{weekday:'long',day:'numeric',month:'long'});
const rgba=(h,a)=>{const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`};
const hex=(r,g,b)=>'#'+[r,g,b].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
const hsl2rgb=(h,s,l)=>{const a=s*Math.min(l,1-l),f=n=>{const k=(n+h/30)%12;return(l-a*Math.max(-1,Math.min(k-3,9-k,1)))*255};return[f(0),f(8),f(4)]};
const rgb2hsl=(r,g,b)=>{r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0,s=0;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}return[h,s,l]};
const rad=r=>C.shape==='square'?Math.min(r,8):C.shape==='soft'?Math.min(r,16):r;

/* sonido de aviso */
function beep(){
  if(!C.sound)return;
  try{ac=ac||new AudioContext();const t=ac.currentTime;
    [660,880].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(ac.destination);
      const s=t+i*.14;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.15,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+.18);o.start(s);o.stop(s+.2)});
  }catch(e){}
}

/* colores según la portada */
function setCol(h,s){
  hasCol=true;
  if(s<.12){coverAcc='#e8e8f0';coverW1='#8a8a96';coverW2='#4a4a54';return}
  const sat=Math.max(s,.5);
  coverAcc=hex(...hsl2rgb(h,Math.max(s,.55),.62));
  coverW1=hex(...hsl2rgb(h,sat,.5));
  coverW2=hex(...hsl2rgb(h,sat,.3));
}
function colors(){
  const live=S.cur==='music'&&hasCol&&C.coverMode!=='off';
  root.style.setProperty('--acc',live?coverAcc:C.accent);
  root.style.setProperty('--isl',rgba(C.bg,C.opacity));
  root.style.setProperty('--wv1',coverW1);root.style.setProperty('--wv2',coverW2);
  isl.classList.toggle('wv',live&&C.coverMode==='bg');
}
function extract(src){return new Promise(res=>{const i=new Image();i.onload=()=>{try{const cv=document.createElement('canvas');cv.width=cv.height=16;const x=cv.getContext('2d');x.drawImage(i,0,0,16,16);const d=x.getImageData(0,0,16,16).data;let r=0,g=0,b=0,w=0;for(let k=0;k<d.length;k+=4){const mx=Math.max(d[k],d[k+1],d[k+2]),mn=Math.min(d[k],d[k+1],d[k+2]),s=(mx-mn)/(mx||1),wt=.05+s*s*(mx/255);r+=d[k]*wt;g+=d[k+1]*wt;b+=d[k+2]*wt;w+=wt}res([r/w,g/w,b/w])}catch(e){res(null)}};i.onerror=()=>res(null);i.src=src})}
const coverCss=t=>C.showCover&&coverImg?`url('${coverImg}') center/cover no-repeat`:cover(t);
const paintCover=()=>document.querySelectorAll('#c .cv').forEach(el=>el.style.background=coverCss(M?M.t:''));

/* apariencia */
function apply(n){
  C={...C,...n};
  root.style.setProperty('--sc',C.scale);root.style.setProperty('--fg',C.fg);
  root.style.setProperty('--tw',C.animSpeed==='fast'?'.3s':C.animSpeed==='off'?'0s':'.55s');
  root.classList.toggle('noanim',C.animSpeed==='off');
  document.body.style.fontFamily=`"${C.font}","Segoe UI Emoji",system-ui,sans-serif`;
  const ring=C.borderW>0?`0 0 0 ${C.borderW}px ${C.borderColor}`:'0 0 0 1px #ffffff14';
  isl.style.boxShadow=(C.shadow?'0 6px 16px #0006,':'')+ring;
  const al=C.align;
  document.body.style.justifyContent=al==='left'?'flex-start':al==='right'?'flex-end':'center';
  isl.style.marginLeft=al==='left'?'12px':'0';isl.style.marginRight=al==='right'?'12px':'0';
  isl.style.transformOrigin=al==='left'?'0 0':al==='right'?'100% 0':'50% 0';
  render();
}

/* muñequito */
const listening=()=>!!M&&M.s===4;
const mcls=()=>listening()?(C.headphones?'on ':'')+'dance':'';
const mascot=(sz,cls='')=>{if(!C.mascot)return'';const s=Math.round(sz*C.mascotSize);return `<svg class="mas ${cls}" style="width:${s}px;height:${s}px" viewBox="0 0 32 32" aria-hidden="true">${MASCOTS[C.mascotType]||MASCOTS.penguin}</svg>`};
function refreshMascot(){
  const l=listening();
  isl.classList.toggle('play',l);
  document.querySelectorAll('#c .mas').forEach(m=>{m.classList.toggle('on',m.classList.contains('call')||(l&&C.headphones));m.classList.toggle('dance',l)});
}

/* clima y cuenta regresiva */
const WX=(code,day)=>code===0?[day?'☀️':'🌙','clear']:code<=2?[day?'⛅':'☁️','partly']:code===3?['☁️','cloudy']:code<=48?['🌫️','fog']:code<=57?['🌦️','drizzle']:code<=67?['🌧️','rain']:code<=77?['🌨️','snow']:code<=82?['🌧️','rain']:code<=86?['🌨️','snow']:['⛈️','storm'];
function wx(){
  if(!C.weather||!W)return null;
  const [ic,k]=WX(W.code,W.day),v=C.unit==='F'?W.t*9/5+32:W.t;
  return{ic,t:Math.round(v)+'°',desc:tt(k),city:W.city||''};
}
function countdown(){
  if(!C.cdDate)return'';
  const ms=new Date(C.cdDate+'T00:00:00')-Date.now(),nm=C.cdName?C.cdName+': ':'';
  if(ms<=0)return '⏳ '+(C.cdName||'')+' ✓';
  const d=Math.ceil(ms/864e5);
  return '⏳ '+nm+d+' '+(d===1?tt('day'):tt('days'));
}

const V={
idle:e=>{
  const w=wx(),cd=countdown();
  if(e){
    const pin=C.notesOnIsland?NOTES.find(n=>n.p&&!n.d):null,pend=NOTES.filter(n=>!n.d).length,zl=zonesLine();
    const tb=(a,ic,l,x='')=>`<button class="ib sm" data-a="${a}" aria-label="${esc(l)}" title="${esc(l)}"${x?` style="${x}"`:''}>${ic}</button>`;
    return{w:440,h:122+(cd?14:0)+(pin?16:0)+(zl?14:0),r:30,col:1,html:`<div class="row"><div style="flex:none;max-width:210px"><div class="big num" id="clk" style="font-size:30px;line-height:1">${clock()}</div><div class="t2" style="margin-top:4px">${esc(dateStr())}</div>${cd?`<div class="t2" style="opacity:.9;margin-top:2px">${esc(cd)}</div>`:''}${zl?`<div class="t2" id="znl" style="opacity:.9;margin-top:2px">🌍 ${esc(zl)}</div>`:''}${pin?`<div class="t2" style="opacity:.95;margin-top:2px">📌 ${esc(pin.t)}</div>`:''}</div>${w?`<div style="min-width:0;flex:1;text-align:right"><div class="t1" style="font-size:22px">${w.ic} ${w.t}</div><div class="t2">${esc(w.desc)}${w.city?' · '+esc(w.city):''}</div></div>`:'<span class="sp"></span>'}${mascot(40,mcls())}</div>
<div class="row" style="gap:6px">${C.voiceOn?tb('voice','🎤',tt('assistant')):''}${tb('notes','📝',tt('notes'),'width:auto;min-width:28px;padding:0 9px;font-size:13px').replace('📝</button>','📝'+(pend?' '+pend:'')+'</button>')}${tb('sw','⏱',tt('stopwatch'))}${tb('pomo','🍅',tt('pomodoro'))}${tb('stats','📊',tt('stats'))}${tb('clip','📋',tt('clipboard'))}${tb('apps','🚀',tt('apps'))}${tb('shot','📸',tt('shot'))}${tb('gear','⚙️',tt('settings'))}</div>`};
  }
  const mw=C.mascot?Math.round(28*C.mascotSize)+10:0;
  return{w:24+(C.seconds?64:42)+(w?52:0)+48+mw+10,h:36,r:18,html:`<span class="num" id="clk">${clock()}</span>${w?`<span class="t2" style="opacity:.9">${w.ic} ${w.t}</span>`:''}<span class="t2" id="dts" style="opacity:.8">${esc(shortDate())}</span><span class="sp"></span>${mascot(28,mcls())}`};
},
music:e=>{
  const t=M?(M.t||tt('noTitle')):tt('noMusic'),a=M?M.a:'',on=listening(),pr=M&&M.d>0?Math.min(100,M.p/M.d*100):0;
  const vp=Math.round(VOL.vol*100),vi=VOL.mute||vp===0?I.mute:I.vol;
  const times=(id,txt,al)=>C.showTimes?`<span class="t2 num" id="${id}" style="width:44px;${al}">${txt}</span>`:'<span style="width:0"></span>';
  if(e)return{w:400,h:150+(C.volSlider?38:0),r:34,col:1,html:`<div class="row"><div class="cov l cv" style="background:${coverCss(t)}"></div><div style="min-width:0;flex:1"><div class="t1" id="mt">${esc(t)}</div><div class="t2" id="ma">${esc(a)}</div></div>${mascot(44,mcls())||(C.showBars?bars(on):'')}</div>
<div class="prog"><b id="pg" style="width:${pr}%"></b></div>

function refreshMusic(){

/* estados temporales: avisos y volumen */
function transient(k,ms){
  clearTimeout(msgT);
  if(!TR.includes(S.cur))S.prev=[S.cur,S.exp];
  S.cur=k;S.exp=false;render();
  msgT=setTimeout(back,ms);
}
function back(){
  if(!TR.includes(S.cur))return;
  if(S.cur==='listen')voiceBusy=false;
  const p=S.prev||['idle',false];S.prev=null;
  if(p[0]==='timer'||VIEWS.includes(p[0])||(p[0]==='music'&&M)||(p[0]==='call'&&callApp)){S.cur=p[0];S.exp=p[1]}
  else{S.cur=rest();S.exp=false}
  render();
}
function notify(t,b){S.msg={t:String(t),b:String(b||'')};transient('msg',C.msgSecs*1000);beep()}
function updateVol(){
  const p=Math.round(VOL.vol*100),set=(id,f)=>{const el=document.getElementById(id);if(el)f(el)};
  set('vb',el=>el.style.width=(VOL.mute?0:p)+'%');

  set('vi',el=>el.innerHTML=VOL.mute||p===0?I.mute:I.vol);
}
function showVol(){
  if(S.cur==='vol'){updateVol();clearTimeout(msgT);msgT=setTimeout(back,1800);return}
  transient('vol',1800);
}
function syncSlider(){
  const p=Math.round(VOL.vol*100),s=document.getElementById('vs');

function onVolume(v){
  const recent=Date.now()-lastSet<700;

  if(Date.now()-lastSlider>700){VOL.vol=v.vol;VOL.mute=!!v.mute}

/* música real */
function onMedia(m){
  if(m&&!m.none&&C.musicIgnore){
    const ig=C.musicIgnore.toLowerCase().split(',').map(x=>x.trim()).filter(Boolean),src=(m.src||'').toLowerCase();
    if(ig.some(x=>src.includes(x)))m=null;
  }
  M=m&&!m.none?m:null;
  const key=M?M.t+'|'+M.a:'';
  if(key!==curKey){curKey=key;coverImg='';if(M)setCol(hue(M.t||'x'),.7);else hasCol=false}
  refreshMascot();
  if(S.cur==='music'){refreshMusic();colors()}
  if(!C.autoMusic||(S.cur!=='idle'&&S.cur!=='music'))return;
  if(!M){if(S.cur==='music'&&!S.manual)base();return}
  const playing=M.s===4;
  if(dismissKey&&key!==dismissKey)dismissKey='';
  if(playing){
    pausedAt=0;
    if(key===dismissKey)return;
    if(S.cur!=='music'||key!==lastKey){
      lastKey=key;S.cur='music';S.exp=true;S.manual=false;render();
      clearTimeout(autoT);autoT=setTimeout(()=>{if(S.cur==='music'&&!S.manual){S.exp=false;render()}},C.expandSecs*1000);
    }
  }else if(S.cur==='music'&&!S.manual){
    if(!pausedAt)pausedAt=Date.now();
    if(Date.now()-pausedAt>10000)base();
  }
}
async function onCover(img){

  paintCover();colors();
}

const KNOWN=[[/discord/i,'Discord'],[/whatsapp/i,'WhatsApp'],[/teams/i,'Teams'],[/zoom/i,'Zoom'],[/telegram/i,'Telegram'],[/skype/i,'Skype'],[/slack/i,'Slack'],[/webex/i,'Webex'],[/signal/i,'Signal'],[/viber/i,'Viber'],[/chrome/i,'Chrome'],[/msedge|edge/i,'Edge'],[/firefox/i,'Firefox']];
function onMic(list){
  if(!C.calls)list=[];
  let name=null;
  for(const n of list){for(const[re,nm]of KNOWN)if(re.test(n)){name=nm;break}if(name)break}
  if(name&&!callApp){
    callApp=name;callStart=Date.now();
    if(['idle','music','call'].includes(S.cur)){
      S.cur='call';S.exp=true;S.manual=false;render();
      clearTimeout(callT);callT=setTimeout(()=>{if(S.cur==='call'&&!S.manual){S.exp=false;render()}},3000);
    }
  }else if(name&&callApp&&name!==callApp){callApp=name}
  else if(!name&&callApp){callApp=null;if(S.cur==='call')base()}
}


/* asistente de voz */
const say=(es,en)=>C.lang==='en'?en:es;
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[¿?¡!.,;:"“”]/g,' ').replace(/\s+/g,' ').trim();
const NUMW={un:1,una:1,uno:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,quince:15,veinte:20,treinta:30,cuarenta:40,cincuenta:50,sesenta:60,media:.5,medio:.5,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,fifteen:15,twenty:20,thirty:30,forty:40,fifty:50,sixty:60,half:.5,a:1,an:1};
function numIn(s){
  const m=String(s).match(/\d+(?:[.,]\d+)?/);
  if(m)return parseFloat(m[0].replace(',','.'));
  return NUMW[String(s).trim()]??null;
}
function fmtDur(s){
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60,o=[];
  if(h)o.push(h+' h');if(m)o.push(m+' min');if(r)o.push(r+' s');
  return o.join(' ')||'0 s';
}
function ping(){
  if(!C.sound)return;
  try{ac=ac||new AudioContext();const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.frequency.value=1000;o.connect(g);g.connect(ac.destination);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.12,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+.12);o.start(t);o.stop(t+.14)}catch(e){}
}
function speak(text){
  if(!C.voiceSpeak||!('speechSynthesis' in window))return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text),lg=C.lang==='en'?'en':'es';
    u.lang=lg==='en'?'en-US':'es-ES';
    const vs=speechSynthesis.getVoices();
    const v=vs.find(x=>C.voiceName&&x.name===C.voiceName)||vs.find(x=>x.lang.toLowerCase().startsWith(lg));
    if(v)u.voice=v;
    u.rate=C.voiceRate||1;u.pitch=C.voicePitch||1;u.volume=(C.voiceVolume==null?100:C.voiceVolume)/100;
    speechSynthesis.speak(u);
  }catch(e){}
}
function startVoice(){
  if(!C.voiceOn||voiceBusy)return;
  voiceBusy=true;
  try{speechSynthesis.cancel()}catch(e){}
  transient('listen',(C.voiceTimeout+4)*1000);
  ping();
  api.voiceListen();
}
function replyTo(heard,res){
  S.msg={t:heard?'“'+heard+'”':tt('assistant'),b:res.text};
  transient('msg',Math.max(C.msgSecs,5)*1000);
  if(res.keep)S.prev=res.keep;
  speak(res.text);
}
function onHeard(r){
  voiceBusy=false;
  if(r.err){replyTo('',{text:r.err==='norecognizer'?tt('noReco'):tt('voiceErr')});return}
  const text=(r.text||'').trim();
  if(!text){replyTo('',{text:tt('notHeard')});return}
  replyTo(text,runIntent(text));
}
function runIntent(raw){
  const orig=raw.trim(),t=norm(raw);
  let m=orig.match(/^(?:por favor\s+)?(?:anota|apunta|guarda (?:una )?nota|toma nota|nueva nota|crea (?:una )?nota|agrega (?:una )?nota|a[ñn]ade (?:una )?nota|recu[eé]rdame|add (?:a )?note|take (?:a )?note|new note|remember|nota|note)(?:\s+(?:de|que|sobre|to|that|about))?(?:[:,]\s*|\s+)(.+)$/i);
  if(m){api.noteAdd(m[1].trim());return{text:say('Nota guardada.','Note saved.')}}
  if(/\b(borra|elimina|quita|delete|remove)\b.*\b(ultima|last)\b.*\b(nota|note)\b/.test(t)){
    if(!NOTES.length)return{text:say('No tienes notas.','You have no notes.')};
    NOTES=NOTES.slice(1);api.setNotes(NOTES);return{text:say('Última nota borrada.','Last note deleted.')};
  }
  if(/\b(abre|abrir|muestra|muestrame|ver|open|show)\b.*\b(notas?|notes?)\b/.test(t)&&!/bloc de notas|notepad/.test(t)){api.openNotes();return{text:say('Abriendo tus notas.','Opening your notes.')}}
  if(/munequito|mascota|mascot|personaje|character/.test(t)){
    const mt=/pinguino|penguin/.test(t)?'penguin':/\bcono\b|\bcone\b/.test(t)?'cone':/fantasma|ghost/.test(t)?'ghost':null;
    if(mt){api.setSettings({mascotType:mt});return{text:say('Listo, cambié el muñequito.','Done, I changed the mascot.')}}
  }
  if(/\b(cronometro|stopwatch)\b/.test(t)){
    if(/\b(reinicia|reset|reiniciar|borra)\b/.test(t)){SW.run=false;SW.acc=0;SW.laps=[];return{text:say('Cronómetro reiniciado.','Stopwatch reset.'),keep:['sw',false]}}
    if(/\b(deten|detener|para|parar|pausa|pausar|stop|pause)\b/.test(t)){if(SW.run){SW.acc+=Date.now()-SW.start;SW.run=false}return{text:say('Cronómetro detenido.','Stopwatch stopped.'),keep:['sw',false]}}
    if(!SW.run){SW.start=Date.now();SW.run=true}
    return{text:say('Cronómetro iniciado.','Stopwatch started.'),keep:['sw',false]};
  }
  if(/pomodoro/.test(t)){
    if(/\b(cancela|cancelar|deten|detener|para|parar|stop|cancel|pausa|pause)\b/.test(t)){PO.run=false;return{text:say('Pomodoro en pausa.','Pomodoro paused.'),keep:['pomo',false]}}
    PO.run=true;return{text:say('Pomodoro iniciado. A concentrarse.','Pomodoro started. Time to focus.'),keep:['pomo',false]};
  }
  if(/\b(rendimiento|cpu|memoria|ram|performance|memory)\b/.test(t))return{text:'CPU '+STATS.cpu+'%, RAM '+STATS.ram+'%.',keep:['stats',false]};
  if(/\b(portapapeles|clipboard)\b/.test(t)){if(C.clipHistory){S.prev=['clip',true];return{text:say('Aquí está tu historial.','Here is your history.'),keep:['clip',true]}}return{text:tt('clipOff')}}
  if(/\b(captura|pantallazo|screenshot|screen shot)\b/.test(t)){api.shot();return{text:say('Abriendo la captura de pantalla.','Opening the screenshot tool.')}}
  if(/\b(microfono|microphone|mic)\b/.test(t)){micToggle();return{text:VOL.mic?tt('micOff'):tt('micOn')}}
  if(/temporizador|timer|cuenta regresiva|countdown|alarma/.test(t)){
    if(/\b(cancela|cancelar|detener|deten|quita|apaga|cancel|stop|clear)\b/.test(t)){S.tRun=false;S.tLeft=C.timerMin*60;return{text:say('Temporizador cancelado.','Timer cancelled.'),keep:['idle',false]}}
    const mt=t.match(/(\d+(?:[.,]\d+)?|[a-z]+)\s*(horas?|hours?|hrs?|minutos?|minutes?|mins?|segundos?|seconds?|secs?)\b/);
    let secs=C.timerMin*60;
    if(mt){const n=numIn(mt[1]);if(n){const u=mt[2][0];secs=Math.round(n*(u==='h'?3600:u==='m'?60:1))}}
    S.tLeft=secs;S.tRun=true;
    return{text:say('Temporizador de '+fmtDur(secs)+' iniciado.','Timer set for '+fmtDur(secs)+'.'),keep:['timer',false]};
  }
  if(/\b(unmute|quita el silencio|activa el sonido|desilencia|reactiva el sonido)\b/.test(t)){if(VOL.mute)volMute();return{text:say('Sonido activado.','Sound on.')}}
  if(/\b(silencia|silenciar|mute|sin sonido|callate)\b/.test(t)){if(!VOL.mute)volMute();return{text:say('Silenciado.','Muted.')}}
  if(/\b(volumen|volume|sonido|sound)\b/.test(t)){
    const d=t.match(/\b(\d{1,3})\b/);
    const setTo=(p)=>{p=Math.min(100,Math.max(0,p));VOL.vol=p/100;VOL.mute=false;lastSet=Date.now();api.volSet(VOL.vol);return{text:say('Volumen al '+p+'%.','Volume at '+p+'%.')}};
    if(d)return setTo(parseInt(d[1]));
    if(/\b(maximo|max|full)\b/.test(t))return setTo(100);
    const step=(s)=>{VOL.vol=Math.min(1,Math.max(0,VOL.vol+s));VOL.mute=false;lastSet=Date.now();api.volStep(s);return{text:say('Volumen al '+Math.round(VOL.vol*100)+'%.','Volume at '+Math.round(VOL.vol*100)+'%.')}};
    if(/\b(sube|subir|aumenta|aumentar|mas alto|mas fuerte|louder|raise|turn up|up|increase)\b/.test(t))return step(.1);
    if(/\b(baja|bajar|disminuye|reduce|mas bajo|quieter|lower|turn down|down|decrease)\b/.test(t))return step(-.1);
    return{text:say('El volumen está al '+Math.round(VOL.vol*100)+'%.','Volume is at '+Math.round(VOL.vol*100)+'%.')};
  }
  if(/\b(pausa|pausar|pause|detente|para la musica|stop the music|stop music)\b/.test(t)){if(M&&M.s===4)api.media('pp');return{text:M?say('Música en pausa.','Music paused.'):say('No hay música sonando.','No music is playing.')}}
  if(/\b(reproduce|reproducir|play|continua|continuar|resume|reanuda|pon musica)\b/.test(t)){if(M&&M.s!==4)api.media('pp');return{text:M?say('Reproduciendo.','Playing.'):say('No hay música para reproducir.','Nothing to play.')}}
  if(/\b(siguiente|next|salta|skip|otra cancion)\b/.test(t)){api.media('next');return{text:say('Siguiente canción.','Next track.')}}
  if(/\b(anterior|previous|atras)\b/.test(t)){api.media('prev');return{text:say('Canción anterior.','Previous track.')}}
  if(/\bque hora\b|\bhora es\b|what time|current time/.test(t)){const h=new Date().toLocaleTimeString(tt('locale'),{hour:'2-digit',minute:'2-digit',hour12:!C.h24});return{text:say('Son las '+h+'.','It is '+h+'.')}}
  if(/\bque dia\b|\bfecha\b|what day|the date|today/.test(t))return{text:dateStr()+'.'};
  if(/\b(temperatura|clima|weather|temperature)\b|tiempo hace/.test(t)){const w=wx();return{text:w?say(w.desc+', '+w.t+(w.city?' en '+w.city:'')+'.',w.desc+', '+w.t+(w.city?' in '+w.city:'')+'.'):say('No tengo el clima en este momento.','Weather is not available right now.')}}
  if(/\b(configuracion|ajustes|settings|preferences|opciones)\b/.test(t)){api.openSettings();return{text:say('Abriendo configuración.','Opening settings.')}}
  if(/^(abre|abrir|open|lanza|ejecuta|inicia|launch)\b/.test(t)){
    const Ls=launchers(),q=t.replace(/^(abre|abrir|open|lanza|ejecuta|inicia|launch)\s+(el|la|los|las|un|una|the)?\s*/,'');
    const i=Ls.findIndex(a=>{const nm=norm(a.name.replace(/^\p{Extended_Pictographic}\uFE0F?\s*/u,''));return nm&&(q.includes(nm)||nm.includes(q))});
    if(i>=0&&q){api.launch(i);return{text:say('Abriendo '+Ls[i].name.replace(/^\p{Extended_Pictographic}\uFE0F?\s*/u,'')+'.','Opening '+Ls[i].name.replace(/^\p{Extended_Pictographic}\uFE0F?\s*/u,'')+'.')}}
  }
  if(/\b(accesos|aplicaciones|launcher|launchers)\b/.test(t))return{text:say('Aquí están tus accesos.','Here are your launchers.'),keep:['apps',true]};
  if(/\b(oculta|esconde|hide|reposo|idle)\b/.test(t)){if(M)dismissKey=M.t+'|'+M.a;return{text:say('Listo.','Done.'),keep:[callApp?'call':'idle',false]}}
  if(/\b(ayuda|help)\b|que puedes hacer|what can you do/.test(t))return{text:say('Puedo controlar el volumen y la música, poner temporizadores, cronómetro y pomodoro, tomar notas, abrir tus accesos y decirte la hora o el clima.','I can control volume and music, set timers, stopwatch and pomodoro, take notes, open your launchers and tell you the time or weather.')};
  if(/^(hola|hello|hi|hey)\b/.test(t))return{text:say('¡Hola! ¿En qué te ayudo?','Hi! How can I help?')};
  return{text:say('No entendí eso. Prueba con “sube el volumen” o “anota comprar leche”. Di “ayuda” para ver qué puedo hacer.','I did not get that. Try “volume up” or “note buy milk”.')};
}

/* acciones */
function openView(k){
  if(k==='clip'&&!C.clipHistory){notify(tt('clipboard'),tt('clipOff'));return}
  S.cur=k;S.exp=true;S.manual=true;S.hov=false;render();
}
function poNext(auto){
  if(PO.phase==='work'){PO.n++;PO.phase=PO.n%4===0?'long':'break'}else PO.phase='work';
  PO.left=poLen(PO.phase);
  if(auto)notify('🍅 '+tt('pomodoro'),PO.phase==='work'?tt('workTime'):PO.phase==='long'?tt('longBreak'):tt('breakTime'));
  else render();
}
function micToggle(){
  VOL.mic=!VOL.mic;lastSet=Date.now();api.micMute();
  const el=document.getElementById('mb');if(el)el.textContent=VOL.mic?'🔇':'🎙️';
  if(S.cur!=='call')notify(tt('mic'),VOL.mic?tt('micOff'):tt('micOn'));
}
function act(a,b){
  if(VIEWS.includes(a)){openView(a);return}
  if(a==='vx'){base();return}
  if(a==='shot'){api.shot();return}
  if(a==='mic'){micToggle();return}
  if(a==='app'){api.launch(Number(b&&b.dataset.i)||0);return}
  if(a==='clipi'){const i=Number(b&&b.dataset.i)||0;if(CLIPS[i])api.clipSet(CLIPS[i]);return}
  if(a==='clipx'){api.clipClear();return}
  if(a==='swp'){if(SW.run){SW.acc+=Date.now()-SW.start;SW.run=false}else{SW.start=Date.now();SW.run=true}render();return}
  if(a==='swl'){if(swMs()>0)SW.laps.push(swFmt());render();return}
  if(a==='swr'){SW.run=false;SW.acc=0;SW.laps=[];render();return}
  if(a==='pop'){PO.run=!PO.run;render();return}
  if(a==='pos'){poNext(false);return}
  if(a==='por'){PO.phase='work';PO.left=C.pomoWork*60;PO.run=false;PO.n=0;render();return}
  if(['prev','pp','next'].includes(a)){api.media(a);return}
  if(a==='mute'){volMute();return}
  if(a==='voice'){startVoice();return}
  if(a==='notes'){api.openNotes();return}
  if(a==='gear'){api.openSettings();return}
  if(a==='tp')S.tRun=!S.tRun;
  if(a==='t1')S.tLeft+=60;
  if(a==='tr'){S.tLeft=C.timerMin*60;S.tRun=false}
  if(a==='tx'){S.tRun=false;base();return}
  render();
}
api.on('show',k=>{
  if(k==='music'){
    if(!M){notify(tt('music'),tt('nothing'));return}
    S.manual=true;lastKey=M.t+'|'+M.a;
    if(S.cur==='music')S.exp=!S.exp;else{S.cur='music';S.exp=true}
    render();
  }else if(k==='timer'){
    if(S.cur==='timer'){base();return}
    S.cur='timer';S.exp=true;
    if(!S.tRun){S.tLeft=C.timerMin*60;S.tRun=true}
    render();
  }else if(k==='test'){notify(tt('testT'),tt('testB'))}
  else if(k==='volup')volStep(1);
  else if(k==='voldown')volStep(-1);
  else if(k==='mute')volMute();
  else if(k==='voice')startVoice();
  else if(VIEWS.includes(k)){if(S.cur===k)base();else openView(k)}
  else if(k==='micmute')micToggle();
  else if(k==='speaktest')speak(say('Hola, soy Cubo. Así sueno.','Hi, I am Cubo. This is how I sound.'));
  else if(k==='idle'){
    if(M)dismissKey=M.t+'|'+M.a;
    S.cur=callApp?'call':'idle';S.exp=false;S.manual=false;render();
  }
});
api.on('notify',(t,b)=>notify(t,b));
api.on('media',onMedia);
api.on('cover',onCover);
api.on('mic',onMic);
api.on('volume',onVolume);
api.on('heard',onHeard);
api.on('stats',s=>{STATS=s;const set=(id,f)=>{const el=document.getElementById(id);if(el)f(el)};set('stc',e=>e.textContent=s.cpu+'%');set('str',e=>e.textContent=s.ram+'%');set('stcb',e=>e.style.width=s.cpu+'%');set('strb',e=>e.style.width=s.ram+'%');set('strd',e=>e.textContent=(s.used/1073741824).toFixed(1)+' / '+(s.total/1073741824).toFixed(1)+' GB')});
api.on('clip',a=>{CLIPS=a||[];if(S.cur==='clip')render()});
api.on('notes',a=>{NOTES=a||[];if(S.cur==='idle'&&S.exp)render()});
api.getNotes().then(a=>{NOTES=a||[]});
api.on('weather',w=>{W=w;if(S.cur==='idle')render()});
api.on('settings',apply);
api.getSettings().then(apply);
api.getWeather().then(w=>{if(w){W=w;if(S.cur==='idle')render()}});

/* arrastrar, clic, rueda y menú */
let pdn=null,dragging=false,justDragged=false;
isl.addEventListener('pointerdown',e=>{
  if(e.button!==0||e.target.closest('[data-a],input'))return;
  pdn={x:e.screenX,y:e.screenY};dragging=false;isl.setPointerCapture(e.pointerId);
});
isl.addEventListener('pointermove',e=>{
  if(!pdn||C.lock)return;
  if(!dragging&&Math.hypot(e.screenX-pdn.x,e.screenY-pdn.y)>5){dragging=true;api.dragStart(pdn.x,pdn.y)}
  if(dragging)api.dragMove(e.screenX,e.screenY);
});
isl.addEventListener('pointerup',e=>{
  if(dragging){api.dragEnd();justDragged=true;setTimeout(()=>justDragged=false,60)}
  pdn=null;dragging=false;try{isl.releasePointerCapture(e.pointerId)}catch(x){}
});
isl.addEventListener('click',e=>{
  if(justDragged||e.target.closest('input'))return;
  const b=e.target.closest('[data-a]');
  if(b){act(b.dataset.a,b);return}
  if(['music','timer','call','idle',...VIEWS].includes(S.cur)){S.exp=!S.exp;S.manual=true;S.hov=false;render()}
});
isl.addEventListener('input',e=>{
  if(e.target.id!=='vs')return;
  const v=e.target.value/100;
  VOL.vol=v;VOL.mute=false;lastSet=lastSlider=Date.now();api.volSet(v);syncSlider();
});
isl.addEventListener('wheel',e=>{
  if(!C.wheelVol)return;
  e.preventDefault();volStep(e.deltaY<0?1:-1);
},{passive:false});
isl.addEventListener('contextmenu',e=>{e.preventDefault();api.openSettings()});
isl.addEventListener('mouseenter',()=>{
  api.setIgnore(false);
  if(C.hoverExpand&&!S.exp&&['music','timer','call','idle',...VIEWS].includes(S.cur)){
    clearTimeout(hoverT);hoverT=setTimeout(()=>{S.exp=true;S.hov=true;render()},400);
  }
});
isl.addEventListener('mouseleave',()=>{
  api.setIgnore(true);clearTimeout(hoverT);
  if(S.hov){S.hov=false;S.exp=false;render()}
});

/* reloj, temporizador, llamada y avance local de la canción */
setInterval(()=>{
  if(S.tRun&&S.tLeft>0){S.tLeft--;if(S.tLeft===0){S.tRun=false;notify(tt('timer'),tt('timerEnd'))}}
  const set=(id,x)=>{const el=document.getElementById(id);if(el)el.textContent=x};
  set('clk',clock());set('dts',shortDate());set('tm',tm(S.tLeft));
  if(callApp){const el=Math.floor((Date.now()-callStart)/1000);set('cl',S.exp?tt('inCall')+' · '+mm(el):mm(el))}
  if(M&&M.s===4){M.p++;refreshMusic()}
  if(PO.run&&PO.left>0){PO.left--;if(PO.left===0)poNext(true);else set('pot',tm(PO.left))}
  const zl=document.getElementById('znl');if(zl)zl.textContent='🌍 '+zonesLine();
},1000);
setInterval(()=>{if(S.cur==='sw'&&SW.run){const el=document.getElementById('swt');if(el)el.textContent=swFmt()}},100);
render();
</script>
