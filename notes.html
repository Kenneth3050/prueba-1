<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Notas</title>
<style>
:root{color-scheme:dark;--bg:#0e1022;--card:#1c2042;--line:#ffffff1a;--text:#eef0ff;--muted:#a3a8d6;--acc:#7c8cff;--acc2:#ff7ad9}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:radial-gradient(700px 420px at 90% -10%,#3a2f7a66,transparent 70%),radial-gradient(500px 360px at -10% 110%,#7c3a8f44,transparent 70%),var(--bg);color:var(--text);font:14px "Segoe UI","Segoe UI Emoji",system-ui,sans-serif}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 6px 18px;-webkit-app-region:drag}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.3px}
.brand img{width:28px;height:28px;border-radius:8px}
.wb{display:flex;gap:6px;-webkit-app-region:no-drag}
.wb button{all:unset;cursor:pointer;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.wb button:hover{background:#ffffff14;color:var(--text)}
.wb .cl:hover{background:#ff453a;color:#fff}
.add{display:flex;gap:8px;padding:8px 18px}
.add input{flex:1;min-width:0;background:#0b0d1e;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font:inherit}
.add input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px #7c8cff33}
.add button,.tabs button,.clr{font:inherit;font-weight:600;color:var(--text);background:#ffffff12;border:1px solid var(--line);border-radius:12px;padding:9px 14px;cursor:pointer}
.add button{background:linear-gradient(90deg,var(--acc),var(--acc2));border:0;color:#fff}
.add button:hover,.tabs button:hover,.clr:hover{filter:brightness(1.15)}
.tabs{display:flex;gap:6px;padding:4px 18px 8px}
.tabs button{padding:6px 12px;font-size:12.5px;border-radius:99px}
.tabs button.on{background:#7c8cff33;border-color:var(--acc)}
#list{flex:1;overflow-y:auto;padding:4px 18px 10px;display:flex;flex-direction:column;gap:8px}
#list::-webkit-scrollbar{width:10px}#list::-webkit-scrollbar-thumb{background:#ffffff22;border-radius:6px}
.n{display:flex;align-items:flex-start;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.n.pin{border-color:var(--acc);box-shadow:0 0 0 1px #7c8cff55,0 6px 18px #7c8cff22}
.n input[type=checkbox]{margin-top:3px;width:18px;height:18px;accent-color:var(--acc);flex:none;cursor:pointer}
.tx{flex:1;min-width:0;outline:none;line-height:1.45;white-space:pre-wrap;word-break:break-word;border-radius:6px;padding:1px 3px}
.tx:focus{background:#ffffff0d}
.n.done .tx{text-decoration:line-through;color:var(--muted)}
.meta{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.ab{display:flex;gap:2px;flex:none}
.ab button{all:unset;cursor:pointer;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:13px;opacity:.55}
.ab button:hover{background:#ffffff18;opacity:1}
.ab .on{opacity:1}
.empty{margin:auto;color:var(--muted);text-align:center;line-height:1.7}
footer{display:flex;align-items:center;justify-content:space-between;padding:10px 18px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}
.clr{padding:6px 12px;font-size:12px}
</style>
</head>
<body>
<div id="app">
  <header><div class="brand"><img src="assets/logo.png" alt=""><span id="ttl"></span></div><div class="wb"><button id="bmin" aria-label="min">—</button><button id="bcl" class="cl" aria-label="close">✕</button></div></header>
  <div class="add"><input id="inp" type="text" maxlength="600" autocomplete="off"><button id="addb"></button></div>
  <div class="tabs" id="tabs"></div>
  <div id="list"></div>
  <footer><span id="cnt"></span><button class="clr" id="clr"></button></footer>
</div>
<script>
const $=s=>document.querySelector(s);
let notes=[],lang='es',filter='all';
const D={
 es:{title:'Notas',ph:'Escribe una nota y pulsa Enter',add:'Agregar',all:'Todas',pend:'Pendientes',done:'Hechas',empty:'Aquí aparecerán tus notas.<br>También puedes decir “anota comprar leche”.',pin:'Fijar en la isla',del:'Borrar',clr:'Borrar hechas',cnt:n=>n+(n===1?' pendiente':' pendientes')},
 en:{title:'Notes',ph:'Write a note and press Enter',add:'Add',all:'All',pend:'Pending',done:'Done',empty:'Your notes will show up here.<br>You can also say “note buy milk”.',pin:'Pin to island',del:'Delete',clr:'Clear done',cnt:n=>n+' pending'}
};
const T=()=>D[lang]||D.es;
const esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const save=()=>api.setNotes(notes);
function texts(){
  const t=T();
  $('#ttl').textContent=t.title;document.title=t.title;document.documentElement.lang=lang;
  $('#inp').placeholder=t.ph;$('#addb').textContent=t.add;$('#clr').textContent=t.clr;
  $('#tabs').innerHTML=[['all',t.all],['pend',t.pend],['done',t.done]].map(([k,l])=>`<button data-f="${k}" class="${filter===k?'on':''}">${l}</button>`).join('');
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;texts();render()});
}
function when(ts){return new Date(ts).toLocaleString(lang==='en'?'en':'es',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
function render(){
  const t=T();
  const vis=notes.filter(n=>filter==='all'||(filter==='pend'?!n.d:n.d)).sort((a,b)=>(b.p-a.p)||(b.ts-a.ts));
  $('#list').innerHTML=vis.length?vis.map(n=>`<div class="n${n.d?' done':''}${n.p?' pin':''}" data-id="${esc(n.id)}"><input type="checkbox" ${n.d?'checked':''} aria-label="ok"><div style="flex:1;min-width:0"><div class="tx" contenteditable="true" spellcheck="false">${esc(n.t)}</div><span class="meta">${when(n.ts)}</span></div><div class="ab"><button class="pn${n.p?' on':''}" title="${t.pin}">📌</button><button class="dl" title="${t.del}">✕</button></div></div>`).join(''):`<div class="empty">${t.empty}</div>`;
  $('#cnt').textContent=t.cnt(notes.filter(n=>!n.d).length);
  $('#clr').style.visibility=notes.some(n=>n.d)?'visible':'hidden';
}
function byId(id){return notes.find(n=>n.id===id)}
$('#list').addEventListener('click',e=>{
  const row=e.target.closest('.n');if(!row)return;
  const n=byId(row.dataset.id);if(!n)return;
  if(e.target.closest('.dl')){notes=notes.filter(x=>x!==n)}
  else if(e.target.closest('.pn')){const v=!n.p;notes.forEach(x=>x.p=false);n.p=v}
  else if(e.target.matches('input[type=checkbox]')){n.d=e.target.checked}
  else return;
  save();render();
});
$('#list').addEventListener('focusout',e=>{
  if(!e.target.classList.contains('tx'))return;
  const row=e.target.closest('.n'),n=byId(row.dataset.id);if(!n)return;
  const v=e.target.textContent.trim();
  if(!v){notes=notes.filter(x=>x!==n)}else if(v!==n.t){n.t=v.slice(0,600)}else return;
  save();render();
});
$('#list').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('tx')){e.preventDefault();e.target.blur()}});
function add(){
  const v=$('#inp').value.trim();if(!v)return;
  notes.unshift({id:Date.now()+Math.random().toString(36).slice(2,6),t:v.slice(0,600),d:false,p:false,ts:Date.now()});
  $('#inp').value='';save();render();
}
$('#addb').onclick=add;
$('#inp').addEventListener('keydown',e=>{if(e.key==='Enter')add()});
$('#clr').onclick=()=>{notes=notes.filter(n=>!n.d);save();render()};
$('#bcl').onclick=()=>api.closeSettings();
$('#bmin').onclick=()=>api.minSettings();
api.on('notes',a=>{notes=a||[];const ae=document.activeElement;if(ae&&ae.classList&&ae.classList.contains('tx'))return;render()});
api.on('settings',c=>{if(c.lang!==lang){lang=c.lang;texts();render()}});
Promise.all([api.getSettings(),api.getNotes()]).then(([c,a])=>{lang=c.lang;notes=a||[];texts();render();$('#inp').focus()});
</script>
</body>
</html>
